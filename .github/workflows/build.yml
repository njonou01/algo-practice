name: Build AlgoGénie

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            artifact_name: algogenie-linux-x64
            artifact_path: src-tauri/target/release/bundle/deb/*.deb

          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            artifact_name: algogenie-windows-x64
            artifact_path: src-tauri/target/release/bundle/msi/*.msi

    runs-on: ${{ matrix.platform.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 8

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.platform.rust_target }}

    - name: Install Linux dependencies
      if: matrix.platform.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri

    - name: Cache pnpm dependencies
      uses: actions/cache@v4
      with:
        path: ~/.pnpm-store
        key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Install frontend dependencies
      run: pnpm install --frozen-lockfile

    - name: Build frontend
      run: pnpm run build

    - name: Build Tauri app
      uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tagName: v__VERSION__
        releaseName: 'AlgoGénie v__VERSION__'
        releaseBody: |
          ## 🎉 Nouvelle version d'AlgoGénie

          ### Changements
          - Voir le changelog complet dans les notes de version

          ### Installation
          - **Linux**: Téléchargez le fichier `.deb` et installez avec `sudo dpkg -i algogenie_*.deb`
          - **Windows**: Téléchargez le fichier `.msi` et exécutez-le
        releaseDraft: true
        prerelease: false
        args: --target ${{ matrix.platform.rust_target }}

    - name: Upload artifacts (Linux .deb)
      if: matrix.platform.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.platform.artifact_name }}
        path: src-tauri/target/release/bundle/deb/*.deb
        if-no-files-found: error

    - name: Upload artifacts (Windows .msi)
      if: matrix.platform.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.platform.artifact_name }}
        path: src-tauri/target/release/bundle/msi/*.msi
        if-no-files-found: error

  # Job séparé pour les tests
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 8

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run frontend tests
      run: pnpm test --if-present

    - name: Run Rust tests
      working-directory: src-tauri
      run: cargo test --verbose

    - name: Check TypeScript
      run: pnpm run build

    - name: Lint code
      run: pnpm run lint --if-present
