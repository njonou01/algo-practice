name: Release AlgoGenie

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: AlgoGenie ${{ github.ref }}
          body: |
            Nouvelle version d'AlgoGenie

            Telechargement:
            - Linux: Fichier .deb ci-dessous
            - Windows: Fichier .msi ci-dessous

            Installation:

            Linux (Debian/Ubuntu):
            sudo dpkg -i algogenie_*_amd64.deb

            Windows:
            Double-cliquez sur le fichier .msi

            Changements:
            Voir les commits depuis la derniere version
          draft: false
          prerelease: false

  build-release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle: deb

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: msi

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-22.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri

    - name: Install dependencies
      run: pnpm install

    - name: Build app
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      run: pnpm tauri build --target ${{ matrix.target }}

    - name: Upload Linux DEB
      if: matrix.os == 'ubuntu-22.04'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./src-tauri/target/${{ matrix.target }}/release/bundle/deb/algogenie_${{ needs.create-release.outputs.version }}_amd64.deb
        asset_name: AlgoGenie-${{ needs.create-release.outputs.version }}-linux-amd64.deb
        asset_content_type: application/vnd.debian.binary-package

    - name: Upload Linux RPM
      if: matrix.os == 'ubuntu-22.04'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./src-tauri/target/${{ matrix.target }}/release/bundle/rpm/algogenie-${{ needs.create-release.outputs.version }}-1.x86_64.rpm
        asset_name: AlgoGenie-${{ needs.create-release.outputs.version }}-linux-x86_64.rpm
        asset_content_type: application/x-rpm

    - name: Upload Linux AppImage
      if: matrix.os == 'ubuntu-22.04'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./src-tauri/target/${{ matrix.target }}/release/bundle/appimage/algogenie_${{ needs.create-release.outputs.version }}_amd64.AppImage
        asset_name: AlgoGenie-${{ needs.create-release.outputs.version }}-linux-amd64.AppImage
        asset_content_type: application/x-executable

    - name: Upload Windows MSI
      if: matrix.os == 'windows-latest'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./src-tauri/target/${{ matrix.target }}/release/bundle/msi/AlgoGenie_${{ needs.create-release.outputs.version }}_x64_en-US.msi
        asset_name: AlgoGenie-${{ needs.create-release.outputs.version }}-windows-x64.msi
        asset_content_type: application/x-msi

    - name: Upload Windows NSIS
      if: matrix.os == 'windows-latest'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./src-tauri/target/${{ matrix.target }}/release/bundle/nsis/AlgoGenie_${{ needs.create-release.outputs.version }}_x64-setup.exe
        asset_name: AlgoGenie-${{ needs.create-release.outputs.version }}-windows-x64-setup.exe
        asset_content_type: application/x-msdownload

    - name: Upload MSI Signature
      if: matrix.os == 'windows-latest'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./src-tauri/target/${{ matrix.target }}/release/bundle/msi/AlgoGenie_${{ needs.create-release.outputs.version }}_x64_en-US.msi.sig
        asset_name: AlgoGenie-${{ needs.create-release.outputs.version }}-windows-x64.msi.sig
        asset_content_type: text/plain

    - name: Upload NSIS Signature
      if: matrix.os == 'windows-latest'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./src-tauri/target/${{ matrix.target }}/release/bundle/nsis/AlgoGenie_${{ needs.create-release.outputs.version }}_x64-setup.exe.sig
        asset_name: AlgoGenie-${{ needs.create-release.outputs.version }}-windows-x64-setup.exe.sig
        asset_content_type: text/plain

  create-update-manifest:
    needs: [create-release, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Read MSI signature
        id: msi_sig
        run: |
          curl -s https://github.com/njonou01/algo-practice/releases/download/v${{ steps.get_version.outputs.version }}/AlgoGenie-${{ steps.get_version.outputs.version }}-windows-x64.msi.sig -o msi.sig
          echo "signature=$(cat msi.sig)" >> $GITHUB_OUTPUT

      - name: Create latest.json
        run: |
          cat > latest.json << EOF
          {
            "version": "${{ steps.get_version.outputs.version }}",
            "notes": "Nouvelle version d'AlgoGénie",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "url": "https://github.com/njonou01/algo-practice/releases/download/v${{ steps.get_version.outputs.version }}/AlgoGenie-${{ steps.get_version.outputs.version }}-windows-x64.msi",
                "signature": "${{ steps.msi_sig.outputs.signature }}"
              }
            }
          }
          EOF

      - name: Upload latest.json to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./latest.json
          asset_name: latest.json
          asset_content_type: application/json

  update-latest-tag:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Update latest tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -f latest
          git push -f origin latest
