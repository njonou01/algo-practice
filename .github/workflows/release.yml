name: Release AlgoGenie

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install

      - name: Build app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: pnpm tauri build --target x86_64-unknown-linux-gnu

      - name: Rename Linux artifacts
        run: |
          mkdir -p artifacts
          cp "./src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/AlgoGenie_${{ steps.get_version.outputs.version }}_amd64.deb" "artifacts/AlgoGenie-${{ steps.get_version.outputs.version }}-linux-amd64.deb"
          cp "./src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/AlgoGenie-${{ steps.get_version.outputs.version }}-1.x86_64.rpm" "artifacts/AlgoGenie-${{ steps.get_version.outputs.version }}-linux-x86_64.rpm"
          cp "./src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/AlgoGenie_${{ steps.get_version.outputs.version }}_amd64.AppImage" "artifacts/AlgoGenie-${{ steps.get_version.outputs.version }}-linux-amd64.AppImage"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: artifacts/*
          retention-days: 1

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install

      - name: Build app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: pnpm tauri build --target x86_64-pc-windows-msvc

      - name: Rename Windows artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          cp "./src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/AlgoGenie_${{ steps.get_version.outputs.version }}_x64_en-US.msi" "artifacts/AlgoGenie-${{ steps.get_version.outputs.version }}-windows-x64.msi"
          cp "./src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/AlgoGenie_${{ steps.get_version.outputs.version }}_x64_en-US.msi.sig" "artifacts/AlgoGenie-${{ steps.get_version.outputs.version }}-windows-x64.msi.sig"
          cp "./src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/AlgoGenie_${{ steps.get_version.outputs.version }}_x64-setup.exe" "artifacts/AlgoGenie-${{ steps.get_version.outputs.version }}-windows-x64-setup.exe"
          cp "./src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/AlgoGenie_${{ steps.get_version.outputs.version }}_x64-setup.exe.sig" "artifacts/AlgoGenie-${{ steps.get_version.outputs.version }}-windows-x64-setup.exe.sig"

      - name: Create latest.json manifest
        shell: bash
        run: |
          SIGNATURE=$(cat "artifacts/AlgoGenie-${{ steps.get_version.outputs.version }}-windows-x64.msi.sig")
          cat > artifacts/latest.json << EOF
          {
            "version": "${{ steps.get_version.outputs.version }}",
            "notes": "Nouvelle version d'AlgoGénie",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "url": "https://github.com/njonou01/algo-practice/releases/download/v${{ steps.get_version.outputs.version }}/AlgoGenie-${{ steps.get_version.outputs.version }}-windows-x64.msi",
                "signature": "$SIGNATURE"
              }
            }
          }
          EOF

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: artifacts/*
          retention-days: 1

  create-release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: release-files

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: release-files

      - name: List all files
        run: |
          echo "Files to upload:"
          ls -lh release-files/

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/AlgoGenie-${{ steps.get_version.outputs.version }}-linux-amd64.deb
            release-files/AlgoGenie-${{ steps.get_version.outputs.version }}-linux-x86_64.rpm
            release-files/AlgoGenie-${{ steps.get_version.outputs.version }}-linux-amd64.AppImage
            release-files/AlgoGenie-${{ steps.get_version.outputs.version }}-windows-x64.msi
            release-files/AlgoGenie-${{ steps.get_version.outputs.version }}-windows-x64.msi.sig
            release-files/AlgoGenie-${{ steps.get_version.outputs.version }}-windows-x64-setup.exe
            release-files/AlgoGenie-${{ steps.get_version.outputs.version }}-windows-x64-setup.exe.sig
            release-files/latest.json
          fail_on_unmatched_files: true
          body: |
            Nouvelle version d'AlgoGenie

            Telechargement:
            - Linux: Fichiers .deb, .rpm ou .AppImage ci-dessous
            - Windows: Fichiers .msi ou .exe ci-dessous

            Installation:

            Linux (Debian/Ubuntu):
            ```bash
            sudo dpkg -i AlgoGenie-${{ steps.get_version.outputs.version }}-linux-amd64.deb
            ```

            Linux (Fedora/RHEL):
            ```bash
            sudo rpm -i AlgoGenie-${{ steps.get_version.outputs.version }}-linux-x86_64.rpm
            ```

            Linux (AppImage):
            ```bash
            chmod +x AlgoGenie-${{ steps.get_version.outputs.version }}-linux-amd64.AppImage
            ./AlgoGenie-${{ steps.get_version.outputs.version }}-linux-amd64.AppImage
            ```

            Windows:
            Double-cliquez sur le fichier .msi ou .exe

  update-latest-tag:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update latest tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -f latest
          git push -f origin latest
