name: Release AlgoGenie

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get version from tag
      id: get_version
      shell: bash
      run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-22.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri

    - name: Install dependencies
      run: pnpm install

    - name: Build app
      env:
        TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      run: pnpm tauri build --target ${{ matrix.target }}

    - name: Prepare Linux artifacts
      if: matrix.os == 'ubuntu-22.04'
      run: |
        mkdir -p release-artifacts
        cp "./src-tauri/target/${{ matrix.target }}/release/bundle/deb/AlgoGenie_${{ steps.get_version.outputs.version }}_amd64.deb" "release-artifacts/AlgoGenie-${{ steps.get_version.outputs.version }}-linux-amd64.deb"
        cp "./src-tauri/target/${{ matrix.target }}/release/bundle/rpm/AlgoGenie-${{ steps.get_version.outputs.version }}-1.x86_64.rpm" "release-artifacts/AlgoGenie-${{ steps.get_version.outputs.version }}-linux-x86_64.rpm"
        cp "./src-tauri/target/${{ matrix.target }}/release/bundle/appimage/AlgoGenie_${{ steps.get_version.outputs.version }}_amd64.AppImage" "release-artifacts/AlgoGenie-${{ steps.get_version.outputs.version }}-linux-amd64.AppImage"

    - name: Prepare Windows artifacts
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        mkdir -p release-artifacts
        cp "./src-tauri/target/${{ matrix.target }}/release/bundle/msi/AlgoGenie_${{ steps.get_version.outputs.version }}_x64_en-US.msi" "release-artifacts/AlgoGenie-${{ steps.get_version.outputs.version }}-windows-x64.msi"
        cp "./src-tauri/target/${{ matrix.target }}/release/bundle/msi/AlgoGenie_${{ steps.get_version.outputs.version }}_x64_en-US.msi.sig" "release-artifacts/AlgoGenie-${{ steps.get_version.outputs.version }}-windows-x64.msi.sig"
        cp "./src-tauri/target/${{ matrix.target }}/release/bundle/nsis/AlgoGenie_${{ steps.get_version.outputs.version }}_x64-setup.exe" "release-artifacts/AlgoGenie-${{ steps.get_version.outputs.version }}-windows-x64-setup.exe"
        cp "./src-tauri/target/${{ matrix.target }}/release/bundle/nsis/AlgoGenie_${{ steps.get_version.outputs.version }}_x64-setup.exe.sig" "release-artifacts/AlgoGenie-${{ steps.get_version.outputs.version }}-windows-x64-setup.exe.sig"

    - name: Create latest.json manifest
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        SIGNATURE=$(cat "release-artifacts/AlgoGenie-${{ steps.get_version.outputs.version }}-windows-x64.msi.sig")
        cat > release-artifacts/latest.json << EOF
        {
          "version": "${{ steps.get_version.outputs.version }}",
          "notes": "Nouvelle version d'AlgoGénie",
          "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
          "platforms": {
            "windows-x86_64": {
              "url": "https://github.com/njonou01/algo-practice/releases/download/v${{ steps.get_version.outputs.version }}/AlgoGenie-${{ steps.get_version.outputs.version }}-windows-x64.msi",
              "signature": "$SIGNATURE"
            }
          }
        }
        EOF

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.os }}
        path: release-artifacts/*
        retention-days: 1

  create-release:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Prepare release directory
        run: |
          mkdir -p release-files
          find all-artifacts -type f -exec cp {} release-files/ \;
          ls -lah release-files/

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          body: |
            Nouvelle version d'AlgoGenie

            Telechargement:
            - Linux: Fichiers .deb, .rpm ou .AppImage ci-dessous
            - Windows: Fichiers .msi ou .exe ci-dessous

            Installation:

            Linux (Debian/Ubuntu):
            ```bash
            sudo dpkg -i AlgoGenie-${{ steps.get_version.outputs.version }}-linux-amd64.deb
            ```

            Linux (Fedora/RHEL):
            ```bash
            sudo rpm -i AlgoGenie-${{ steps.get_version.outputs.version }}-linux-x86_64.rpm
            ```

            Linux (AppImage):
            ```bash
            chmod +x AlgoGenie-${{ steps.get_version.outputs.version }}-linux-amd64.AppImage
            ./AlgoGenie-${{ steps.get_version.outputs.version }}-linux-amd64.AppImage
            ```

            Windows:
            Double-cliquez sur le fichier .msi ou .exe

  update-latest-tag:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update latest tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -f latest
          git push -f origin latest
