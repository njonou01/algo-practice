<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond dégradé moderne -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rectangle de fond sans bordure arrondie -->
  <rect width="512" height="512" fill="url(#bgGradient)"/>

  <!-- Initiales GN au centre -->
  <text x="256" y="320" font-family="Arial, sans-serif" font-size="220" font-weight="bold"
        fill="white" text-anchor="middle" opacity="0.95">GN</text>

  <!-- Symboles de code en bas -->
  <g transform="translate(256, 420)" fill="white" opacity="0.3">
    <text x="-80" y="0" font-family="monospace" font-size="45" font-weight="bold">&lt;/&gt;</text>
    <text x="30" y="0" font-family="monospace" font-size="45" font-weight="bold">{ }</text>
  </g>
</svg>
